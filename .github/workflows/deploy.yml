name: Deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '.deployed'
      - 'docs/**'
      - 'tasks/**'
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npx vite build
      - name: Record deployed sha
        run: echo "$GITHUB_SHA" > dist/public/.deployed-sha && cat dist/public/.deployed-sha
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist/public --project-name=zifu --branch=master --commit-dirty=true
